# Chromium PS5 - default settings (the app's own copy).
# To change them, put a config.ini in /data/chromium-ps5/ (or in the title's
# /download0/chromium-ps5/): the first one found is used, this one last.
#
# What to run:
#   browser            the browser: tabs, address bar, bookmarks, history; pad and keyboard (default)
#   chromium-headless  Chromium's headless shell, prints the page's DOM as text
#   chromium           Chromium's content shell, headless for now
#   hello threads timers dl   gx's own tests
#   shell              busybox: uname, ls /, os-release
#   custom             program = ..., args = ...
run = browser
# url = https://www.google.com/  (what the first tab opens instead of the new tab page; no
#                                 spaces: use %20)
# The browser's window in its own pixels (shown enlarged to the screen: 1280 x 720 is 1.5
# times on a 1920 x 1080 one) and the quality of the pages' pictures (JPEG, 1-100).
# view.width = 1280
# view.height = 720
# view.quality = 85
# Where bookmarks, history and settings are kept (default: "profile" beside the log folder,
# /data/chromium-ps5/profile on the console).
# profile.dir = /data/chromium-ps5/profile
# tz = CET-1CEST,M3.5.0,M10.5.0/3   (the guest's time zone; default: from the console)
# lang = it-IT                       (the language sites are asked for; default: the console's)
# translate.url = https://translate.googleapis.com/translate_a/t
#                                    (who translates the pages for the Translate button: Google's free
#                                     address, or another that answers a POST of q=... the same way)
# The controller's touchpad works as a laptop's (slide: the cursor; tap: click; two fingers:
# scroll, and their tap the other button). Its speed and the rest are in the browser's
# Settings; this leaves it out altogether (sticks and buttons only):
# touchpad = 0

# The network. Chromium's is the Linux kernel's own, behind a NAT made of the console's
# sockets: it reaches what the console reaches. Names are asked at 1.1.1.1, 8.8.8.8 and the
# router (the console's address ending in 1), all at once; dns names other resolvers instead.
# network = 0             (no network at all)
# dns = 192.168.1.1
# dns2 = 9.9.9.9
# network.host = 1        (10.0.2.2 in a page is then the console itself: off unless needed)
# args.extra = --some-flag   (added to Chromium's arguments; "quotes" keep spaces)

# Logs: a level per channel (trace debug info warn error fatal off), or log.all.
# Channels: BOOT CFG MEM ELF PATCH SYS THREAD LKL FS NET GFX INPUT APP CRASH PERF GUEST
log.BOOT = debug
log.LKL = debug
log.CRASH = debug
log.MEM = debug
# The guest's first system calls are always logged (0: none).
trace.first = 40
# Debug switches (0 = off): single-step the first N guest instructions (PC bench
# only: the console does not deliver the trap); resume the first frame on a stub
# that faults on purpose (tests gx's way into guest code).
debug.step = 0
debug.resume_test = 0
log.SYS = warn
# Every guest syscall: log.SYS = trace   (slow, very long logs)
# Only some:           trace.syscalls = openat,mmap,clone

# Downloads. On the console they go to /data/download (the folder Torrent & DL
# uses too) or, as chosen in the browser's Settings, to /data/homebrew. Other
# folders:
# downloads.dir = /mnt/usb0/download
# downloads.homebrew = /data/homebrew
# What Chromium is told is free in its /tmp, which is the kernel's memory (MB).
# It sizes what it keeps of the web by it: 40 makes that some 30 MB.
# memfs.free = 40

# 0.9.0. JavaScript: 1 V8's compilers (fast, and WebAssembly), 0 interpreted. Default: 1,
# unless the last two starts ended early or Settings says "Safe".
# js.jit = 1
# Sound: 0 turns it off (pages then play in silence, as before 0.9.0).
# audio = 1
# Tabs that are not on screen rest, as a desktop's background tabs do; 0: they go on at full speed.
# tabs.rest = 1
# Threads that turn pages into pixels (0: as many as Chromium takes by itself, two).
# raster.threads = 4
# Chromium's data disk (cookies, sign-ins, extensions): made at the first start beside the
# profile, 1 GB at most, filled as needed. 0: none, everything goes with the app.
# data.disk = /data/chromium-ps5/browser.img

# The Linux kernel's memory (MB) and processors for the guest.
kernel.mem = 768
cpus = 4

# 1: code without a syscall patch table is refused (safe); 0: allowed (unsafe on PS5).
patch.require_tables = 1
