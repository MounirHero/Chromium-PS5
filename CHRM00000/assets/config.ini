# Chromium PS5 - default settings (the app's own copy).
# To change them, put a config.ini in /data/chromium-ps5/ (or in the title's
# /download0/chromium-ps5/): the first one found is used, this one last.
#
# What to run:
#   chromium-headless  Chromium's headless shell, prints the page's DOM (default)
#   chromium           Chromium's content shell, headless for now
#   hello threads timers dl   gx's own tests
#   shell              busybox: uname, ls /, os-release
#   custom             program = ..., args = ...
run = chromium-headless
# url = data:text/html,<h1>Hi</h1>    (no spaces: use %20)

# Logs: a level per channel (trace debug info warn error fatal off), or log.all.
# Channels: BOOT CFG MEM ELF PATCH SYS THREAD LKL FS NET GFX INPUT APP CRASH PERF GUEST
log.BOOT = debug
log.LKL = debug
log.CRASH = debug
log.MEM = debug
# The guest's first system calls are always logged (0: none).
trace.first = 300
# Debug switches (0 = off): single-step the first N guest instructions (PC bench
# only: the console does not deliver the trap); resume the first frame on a stub
# that faults on purpose (tests gx's way into guest code).
debug.step = 0
debug.resume_test = 0
log.SYS = warn
# Every guest syscall: log.SYS = trace   (slow, very long logs)
# Only some:           trace.syscalls = openat,mmap,clone

# The Linux kernel's memory (MB) and processors for the guest.
kernel.mem = 768
cpus = 4

# 1: code without a syscall patch table is refused (safe); 0: allowed (unsafe on PS5).
patch.require_tables = 1
